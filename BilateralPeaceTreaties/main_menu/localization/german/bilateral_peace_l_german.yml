l_german:
 bpt_return_location: "Gebiet anbieten"
 bpt_return_location_desc: "Wir übergeben ihnen im Rahmen dieses Friedens eines unserer eigenen Gebiete und mindern damit den Wert der übrigen Forderungen."
 bpt_return_location_entry: "[target.GetName] anbieten"
 bpt_return_location_entry_short: "[target.GetNameWithNoTooltip] anbieten ([Add_CFixedPoint(target.MakeScope.ScriptValue('bpt_location_give_antagonism'),Multiply_CFixedPoint(target.MakeScope.ScriptValue('bpt_location_core'),TARGET_COUNTRY.MakeScope.ScriptValue('bpt_receiver_gp_factor')))|2] [antagonism|E])"

 bpt_return_province: "Provinz anbieten"
 bpt_return_province_desc: "Wir übergeben ihnen im Rahmen dieses Friedens eine ganze Provinz — jedes Gebiet darin, das uns gehört — und mindern damit den Wert der übrigen Forderungen."
 bpt_return_province_entry: "Ganz [target.GetName] anbieten"
 bpt_return_province_entry_short: "Ganz [target.GetNameWithNoTooltip] anbieten ([Add_CFixedPoint(target.MakeScope.ScriptValue('bpt_province_return_antagonism'),Multiply_CFixedPoint(target.MakeScope.ScriptValue('bpt_province_core_sum'),TARGET_COUNTRY.MakeScope.ScriptValue('bpt_receiver_gp_factor')))|2] [antagonism|E])"


