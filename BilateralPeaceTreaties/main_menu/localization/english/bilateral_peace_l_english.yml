l_english:
 # --- Offer Location ---
 bpt_return_location: "Offer Location"
 bpt_return_location_desc: "We will hand one of our own locations over to them as part of this peace, reducing what the rest of the deal is worth."
 bpt_return_location_entry: "Offer [target.GetName] to them"
 bpt_return_location_entry_short: "Offer [target.GetNameWithNoTooltip] ([Add_CFixedPoint(target.MakeScope.ScriptValue('bpt_location_give_antagonism'),Multiply_CFixedPoint(target.MakeScope.ScriptValue('bpt_location_core'),TARGET_COUNTRY.MakeScope.ScriptValue('bpt_receiver_gp_factor')))|2] [antagonism|E])"

 # --- Offer Province (every location of it we hold) ---
 bpt_return_province: "Offer Province"
 bpt_return_province_desc: "We will hand a whole province back to them as part of this peace — every location in it that we hold — reducing what the rest of the deal is worth."
 bpt_return_province_entry: "Offer all of [target.GetName] to them"
 bpt_return_province_entry_short: "Offer all of [target.GetNameWithNoTooltip] ([Add_CFixedPoint(target.MakeScope.ScriptValue('bpt_province_return_antagonism'),Multiply_CFixedPoint(target.MakeScope.ScriptValue('bpt_province_core_sum'),TARGET_COUNTRY.MakeScope.ScriptValue('bpt_receiver_gp_factor')))|2] [antagonism|E])"

# --- Ducats ---
 bpt_pay_indemnity_1: "Pay Indemnity"
 bpt_pay_indemnity_1_desc: "We will pay them one loan's worth of gold as part of this peace, reducing what the rest of the deal is worth. Add another coin for each further loan — five is the most the peace table allows."
 bpt_pay_indemnity_1_entry: "Pay them one loan's worth of gold"
 bpt_pay_indemnity_1_entry_short: "+1 loan"

