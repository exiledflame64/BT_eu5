l_english:
 # --- Offer Location ---
 bpt_return_location: "Offer Location"
 bpt_return_location_desc: "We will hand one of our own locations over to them as part of this peace, reducing what the rest of the deal is worth."
 bpt_return_location_entry: "Offer [target.GetName] to them"
 # The antagonism the receiver takes, computed inline so it shows on the row.
 # Localization resolves with the treaty's scopes, so it can reach the target
 # location; the GUI cannot (PeaceTreaty.HasLocation is false for select_trigger
 # targets), which is why the number lives here and not in the antagonism box.
 # Identical ratio to bpt_given_location_antagonism in script_values - keep the
 # two in step. Only multiply/add/divide are used: loc rejected the branch-based
 # form (Select_CFixedPoint / LessThan_CFixedPoint printed raw in Session A.23).
 bpt_return_location_entry_short: "Offer [target.GetNameWithNoTooltip] ([Divide_CFixedPoint(Add_CFixedPoint(Multiply_CFixedPoint(target.GetDevelopment,'(CFixedPoint)4.5978'),'(CFixedPoint)14.413'),Add_CFixedPoint(target.GetDevelopment,'(CFixedPoint)25.111'))|2] [antagonism|E])"

 # --- Offer Province (every location of it we hold) ---
 bpt_return_province: "Offer Province"
 bpt_return_province_desc: "We will hand a whole province back to them as part of this peace — every location in it that we hold — reducing what the rest of the deal is worth."
 bpt_return_province_entry: "Offer all of [target.GetName] to them"
 bpt_return_province_entry_short: "Offer all of [target.GetNameWithNoTooltip]"

 # --- Pay Indemnity: five one-loan units, add as many as you want to pay ---
 # All five share one short label on purpose: the give pane matches on it to
 # tell gold entries apart from land entries.
 bpt_pay_indemnity_1: "Pay Indemnity"
 bpt_pay_indemnity_1_desc: "We will pay them one loan's worth of gold as part of this peace, reducing what the rest of the deal is worth. Add another coin for each further loan — five is the most the peace table allows."
 bpt_pay_indemnity_1_entry: "Pay them one loan's worth of gold"
 bpt_pay_indemnity_1_entry_short: "+1 loan"

