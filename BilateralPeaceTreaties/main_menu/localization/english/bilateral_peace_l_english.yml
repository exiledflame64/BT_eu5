l_english:
 # --- Return Location ---
 bpt_return_location: "Return Location"
 bpt_return_location_desc: "We will hand one of our own locations over to them as part of this peace, reducing what the rest of the deal is worth."
 bpt_return_location_entry: "Return [target.GetName] to them"
 bpt_return_location_entry_short: "Return [target.GetNameWithNoTooltip]"

 # --- Pay Indemnity (tiers of one Loan's worth, mirroring the vanilla gold treaty) ---
 bpt_pay_indemnity_small: "Pay Indemnity (1 Loan)"
 bpt_pay_indemnity_small_desc: "We will pay them one loan's worth of gold as part of this peace, reducing what the rest of the deal is worth."
 bpt_pay_indemnity_small_entry: "Pay them one loan's worth of gold"
 bpt_pay_indemnity_small_entry_short: "Pay indemnity (1 loan)"

 bpt_pay_indemnity_medium: "Pay Indemnity (3 Loans)"
 bpt_pay_indemnity_medium_desc: "We will pay them three loans' worth of gold as part of this peace, reducing what the rest of the deal is worth."
 bpt_pay_indemnity_medium_entry: "Pay them three loans' worth of gold"
 bpt_pay_indemnity_medium_entry_short: "Pay indemnity (3 loans)"

 bpt_pay_indemnity_large: "Pay Indemnity (5 Loans)"
 bpt_pay_indemnity_large_desc: "We will pay them five loans' worth of gold as part of this peace — the most the peace table allows — reducing what the rest of the deal is worth."
 bpt_pay_indemnity_large_entry: "Pay them five loans' worth of gold"
 bpt_pay_indemnity_large_entry_short: "Pay indemnity (5 loans)"

 # --- Bilateral view (give pane) ---
 BPT_GIVE_PANE_TITLE_DEMAND: "You Give"
 BPT_GIVE_PANE_TITLE_OFFER: "You Get Back"
 BPT_GIVE_PANE_HINT: "These terms count against the deal — one net total, capped at ±100%."
 BPT_GOLD_CONFLICT_WARNING: "You are already demanding gold — paying it back cancels out."
